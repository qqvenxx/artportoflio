  <div class="drawing-lightbox" id="drawing-lightbox" hidden>
    <button class="drawing-lightbox-close" id="drawing-lightbox-close" type="button" aria-label="Close viewer">&times;</button>
    <button class="drawing-lightbox-arrow drawing-lightbox-prev" id="drawing-lightbox-prev" type="button" aria-label="Previous drawing">&#8592;</button>
    <div class="drawing-lightbox-content">
      <img class="drawing-lightbox-image" id="drawing-lightbox-image" src="" alt="">
      <div class="drawing-lightbox-caption">
        <span id="drawing-lightbox-counter">01 / 12</span>
        <h2 id="drawing-lightbox-title"></h2>
      </div>
    </div>
    <button class="drawing-lightbox-arrow drawing-lightbox-next" id="drawing-lightbox-next" type="button" aria-label="Next drawing">&#8594;</button>
  </div>
  <script>
    (() => {
      const gallery = document.querySelector('.drawings-grid');
      const lightbox = document.getElementById('drawing-lightbox');
      const lightboxImage = document.getElementById('drawing-lightbox-image');
      const lightboxTitle = document.getElementById('drawing-lightbox-title');
      const lightboxCounter = document.getElementById('drawing-lightbox-counter');
      const closeButton = document.getElementById('drawing-lightbox-close');
      const previousButton = document.getElementById('drawing-lightbox-prev');
      const nextButton = document.getElementById('drawing-lightbox-next');
      let drawings = [];
      let currentIndex = 0;
      let previouslyFocused = null;
      function refreshDrawings() {
        drawings = Array.from(gallery.querySelectorAll('img.drawing-image'));
      }
      function displayDrawing(index) {
        if (!drawings.length) return;
        currentIndex = (index + drawings.length) % drawings.length;
        const image = drawings[currentIndex];
        const card = image.closest('.drawing-card');
        const title = card?.querySelector('.drawing-caption h2')?.textContent.trim();
        lightboxImage.src = image.currentSrc || image.src;
        lightboxImage.alt = image.alt || 'Portfolio drawing';
        lightboxTitle.textContent = '';
        lightboxCounter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(drawings.length).padStart(2, '0')}`;
      }
      function openViewer(index) {
        refreshDrawings();
        if (!drawings.length) return;
        previouslyFocused = document.activeElement;
        displayDrawing(index);
        lightbox.hidden = false;
        document.body.style.overflow = 'hidden';
        closeButton.focus();
      }
      function closeViewer() {
        lightbox.hidden = true;
        lightboxImage.removeAttribute('src');
        document.body.style.overflow = '';
        if (previouslyFocused && typeof previouslyFocused.focus === 'function') {
          previouslyFocused.focus();
        }
      }
      gallery.addEventListener('click', (event) => {
        const image = event.target.closest('img.drawing-image');
        if (!image) return;
        refreshDrawings();
        openViewer(drawings.indexOf(image));
      });
      closeButton.addEventListener('click', closeViewer);
      previousButton.addEventListener('click', () => displayDrawing(currentIndex - 1));
      nextButton.addEventListener('click', () => displayDrawing(currentIndex + 1));
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeViewer();
      });
      document.addEventListener('keydown', (event) => {
        if (lightbox.hidden) return;
        if (event.key === 'Escape') closeViewer();
        if (event.key === 'ArrowLeft') displayDrawing(currentIndex - 1);
        if (event.key === 'ArrowRight') displayDrawing(currentIndex + 1);
      });
    })();
  </script>
